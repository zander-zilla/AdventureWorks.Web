name: before-stack
on:
  push:
    branches: [ "phase-*", master ]
  pull_request:
  workflow_dispatch:
jobs:
  build-app:
    runs-on: ubuntu-22.04
    env:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "2.1.818"
      - run: dotnet build -c Release AdventureWorks.Web.csproj
  generated-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Access-pattern catalog is in sync with its generator
        run: |
          python3 scripts/design/access_patterns.py
          git diff --stat --exit-code docs/design
  before-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Cache AdventureWorks backups
        uses: actions/cache@v4
        with:
          path: docker/before/baks
          key: aw-baks-2022-v1
      - name: Bring up before stack (restore OLTP/DW/LT, enable CDC, start app)
        run: scripts/before-up.sh
      - name: Smoke HTTP check (pages + demo login + order)
        run: scripts/smoke.sh
      - name: Verify CDC on all 68 OLTP tables and that it captured the demo order
        run: |
          sleep 10
          docker exec aw-before-sqlserver-1 /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'AdvWorks!2026' -b -W -d AdventureWorks2022 \
            -Q "SET NOCOUNT ON; IF (SELECT COUNT(*) FROM cdc.Sales_SalesOrderHeader_CT WHERE Comment = 'demo-order') = 0 THROW 50000, 'no CDC rows for demo order', 1; IF (SELECT COUNT(*) FROM cdc.change_tables) <> 68 THROW 50001, 'expected 68 CDC tables', 1; SELECT COUNT(*) cdc_rows FROM cdc.Sales_SalesOrderHeader_CT"
      - name: Reset demo data
        run: docker exec -i aw-before-sqlserver-1 /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'AdvWorks!2026' -b -W < scripts/reset-demo.sql
      - name: Discovery inventory is reproducible from live DBs (after demo reset)
        run: |
          scripts/discovery/generate.sh
          git diff --stat --exit-code docs/discovery
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker/before/docker-compose.yml logs --tail 200
  dynamodb-design:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache AdventureWorks backups
        uses: actions/cache@v4
        with:
          path: docker/before/baks
          key: aw-baks-2022-v1
      - run: pip install -r requirements-design.txt
      - name: mapping.json is in sync with mapping.yaml
        run: |
          python scripts/design/expand_mapping.py
          git diff --stat --exit-code design/mapping
      - name: SQL Server + DynamoDB Local, load via mapping, run access-pattern tests vs SQL
        run: PYTHON=python scripts/design-validate.sh
      - name: Load stats
        if: always()
        run: cat /tmp/load-stats.json || true

  cdc-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache AdventureWorks backups
        uses: actions/cache@v4
        with:
          path: docker/before/baks
          key: aw-baks-2022-v1
      - run: pip install -r requirements-design.txt
      - name: Transform unit tests + Lambda handler tests
        run: python -m pytest -q tests/cdc/test_transform.py tests/cdc/test_lambda.py
      - name: Before stack (SQL Server + demo app)
        run: scripts/before-up.sh
      - name: Bulk-vs-CDC identity test (all 68 tables)
        run: python -m pytest -q tests/cdc/test_identity.py
      - name: CDC stack - DynamoDB Local, consumer (paused), Debezium streaming, bulk load, resume
        run: PYTHON=python scripts/cdc-up.sh
      - name: End-to-end - demo order -> aw-sales, reset-demo -> tombstones
        run: AW_E2E=1 DDB_MULTI=1 python -m pytest -q tests/cdc/test_e2e.py
      - name: Reconcile SQL vs DynamoDB (counts + checksums)
        run: DDB_MULTI=1 python scripts/reconcile.py --out /tmp/reconcile.json
      - name: Results
        if: always()
        run: |
          cat /tmp/cdc-e2e.json || true
          python -c "import json;d=json.load(open('/tmp/reconcile.json'));print(json.dumps(d['summary'],indent=1))" || true
          curl -s localhost:8090/api/status || true
      - name: Logs on failure
        if: failure()
        run: |
          tail -100 /tmp/aw-cdc-consumer.log || true
          docker logs aw-cdc-debezium-1 2>&1 | tail -100 || true
