name: showcase (static build + Playwright)
on:
  push:
    branches: [master, "phase-*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml playwright && python -m playwright install --with-deps chromium
      - name: monitor API Lambda + CDC monitor feed (Phase 8b S-2, no AWS)
        run: python -m pytest -q -p no:cacheprovider tests/cdc/test_monitor_api.py tests/cdc/test_lambda.py
      - name: static build (no AWS, no app/CDC stack)
        run: python showcase/build.py && bash -n scripts/showcase-up.sh scripts/aws/push-showcase.sh
      - name: Playwright - every tab (stub app, recorded replication replay)
        run: SHOWCASE_SCREENSHOTS=screenshots python -m pytest -q -p no:cacheprovider tests/showcase
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: showcase-screenshots
          path: screenshots/
