name: showcase (static build + Playwright)
on:
  push:
    branches: [master, "phase-*", "c2-*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags: Chapter 1 must stay byte-identical to v1.0-migration
      - name: Chapter 1 sources unchanged since v1.0-migration (the local /c1/ build equals the frozen one)
        run: git diff --exit-code v1.0-migration -- showcase/site cdc/monitor/index.html showcase/fixtures
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml playwright && python -m playwright install --with-deps chromium
      - name: monitor API Lambda + CDC monitor feed (Phase 8b S-2, no AWS)
        run: python -m pytest -q -p no:cacheprovider tests/cdc/test_monitor_api.py tests/cdc/test_lambda.py
      - name: static build (no AWS, no app/CDC stack) - Chapter 2 at /, Chapter 1 at /c1/
        run: |
          (cd src/web && npm ci --no-audit --no-fund && npm run build:showcase)
          python showcase/build.py && bash -n scripts/showcase-up.sh scripts/aws/push-showcase.sh scripts/showcase-lighthouse.sh
      - name: Playwright - Chapter 1 every tab (stub app, recorded replication replay)
        run: SHOWCASE_SCREENSHOTS=screenshots python -m pytest -q -p no:cacheprovider tests/showcase
      - name: Playwright - Chapter 2 showcase views, chapter switch, /c1/ frozen, deep links (C2-1)
        run: cd src/web && AW_SCREENSHOTS=../../screenshots/chapter-2 npm run e2e:showcase -- --reporter=line
      - name: Lighthouse before (/c1/) vs after (/)
        run: scripts/showcase-lighthouse.sh "" lighthouse | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: showcase-lighthouse
          path: lighthouse/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: showcase-screenshots
          path: screenshots/
