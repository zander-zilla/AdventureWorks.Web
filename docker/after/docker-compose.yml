# AFTER stack: the .NET 10 app + DynamoDB Local (one instance per table, as the Phase 3 loader runs them).
# Host networking (this box cannot do container-to-container networking). Data is loaded by scripts/after-up.sh
# (Phase 3 loader from the before stack's SQL Server).
name: aw-after
services:
  app:
    build:
      context: ../../src
      dockerfile: ../docker/after/Dockerfile
    image: aw-after-app:local
    network_mode: host
    environment:
      ASPNETCORE_URLS: http://+:5090
      # C2-5: AI layer in mock mode for the e2e run (no AWS; eval-replay model, hash embeddings, no warehouse)
      Ai__Enabled: "${AW_AI_ENABLED:-true}"
      Ai__Mode: mock
      # C2-7: SYNTHETIC=1 (scripts/after-up.sh) -> generated data loaded, offers priced as of today (no 2014-05-01 workaround)
      Pricing__OfferDate: "${AW_OFFER_DATE:-2014-05-01}"
      DynamoDb__Endpoints__aw-catalog: http://localhost:8001
      DynamoDb__Endpoints__aw-customer: http://localhost:8002
      DynamoDb__Endpoints__aw-sales: http://localhost:8007
      # C2-2: fulfilment (stock, TransactionHistory) and pricing (tax, ship methods)
      DynamoDb__Endpoints__aw-inventory: http://localhost:8004
      DynamoDb__Endpoints__aw-reference: http://localhost:8006
      # C2-3: procurement (vendors, purchase orders)
      DynamoDb__Endpoints__aw-purchasing: http://localhost:8005
      # Phase 8: let the local showcase (scripts/showcase-up.sh, :8088) embed the app in its App tab.
      Showcase__FrameAncestors: "http://localhost:* http://127.0.0.1:*"
    read_only: true
    healthcheck:
      test: ["CMD", "dotnet", "--info"]
      disable: true
