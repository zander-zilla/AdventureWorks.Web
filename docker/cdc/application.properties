# Debezium Server: SQL Server CDC (AdventureWorks2022, all 68 captured tables) -> HTTP sink -> cdc/consumer (awcdc transform).
debezium.sink.type=http
debezium.sink.http.url=http://localhost:8090/events
debezium.sink.http.batch.enabled=true
debezium.sink.http.retries=100
debezium.sink.http.retry.interval.ms=2000
debezium.format.value=json
debezium.format.value.schemas.enable=false
debezium.format.key=json
debezium.format.key.schemas.enable=false

debezium.source.connector.class=io.debezium.connector.sqlserver.SqlServerConnector
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=0
debezium.source.schema.history.internal=io.debezium.storage.file.history.FileSchemaHistory
debezium.source.schema.history.internal.file.filename=/debezium/data/schema-history.dat
debezium.source.database.hostname=localhost
debezium.source.database.port=1433
debezium.source.database.user=sa
debezium.source.database.password=${MSSQL_SA_PASSWORD:AdvWorks!2026}
debezium.source.database.names=AdventureWorks2022
debezium.source.database.encrypt=false
debezium.source.topic.prefix=aw
debezium.source.table.include.list=HumanResources\\..*,Person\\..*,Production\\..*,Purchasing\\..*,Sales\\..*
# Bulk load is done by scripts/loader/load.py (same mapping); Debezium only streams changes from "now".
debezium.source.snapshot.mode=no_data
debezium.source.tombstones.on.delete=false
debezium.source.time.precision.mode=connect
debezium.source.decimal.handling.mode=string
debezium.source.binary.handling.mode=base64
debezium.source.poll.interval.ms=200
debezium.source.include.schema.changes=false
quarkus.http.port=8085
quarkus.log.console.json=false
