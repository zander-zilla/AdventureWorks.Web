<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AdventureWorks modernization showcase: Chapter 1 Migration and Chapter 2 Extend & modernize." />
    <title>AdventureWorks · Modernization showcase</title>
    <script>try{var t=localStorage.getItem('aw.theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
    /* deep links into the frozen Chapter 1: /#/c1/<tab> -> /c1/#<tab> */
    (function(){var m=location.hash.match(/^#\/c1\/?(.*)$/);if(m)location.replace('c1/'+(m[1]?'#'+m[1]:''))})()</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/showcase/main.tsx"></script>
  </body>
</html>
